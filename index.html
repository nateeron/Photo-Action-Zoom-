<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <style>

  </style>

  <link rel="stylesheet" href=".\style.css">
</head>

<body>

  <div class="image-row">
    <div class="image-item ">
      <img  onclick="openDialog(src)" src=".\image\image1.jpg" >
    </div>

    <div class="image-item">
      <img class="hover-effect" onclick="openDialog(src)" src=".\image\image3.jpg" alt="Image 3">
    </div>
    <div class="image-item">
      <img class="hover-effect" onclick="openDialog(src)" src=".\image\image4.jpg" alt="Image 4">
    </div>
    <div class="image-item">
      <img class="hover-effect" onclick="openDialog(src)" src=".\image\image5.jpg" alt="Image 5">
    </div>
    <div class="image-item">
      <img class="hover-effect" onclick="openDialog(src)" src=".\image\image6.png" alt="Image 6">
    </div>
    <!-- Add more image items as needed -->
  </div>

  <style>
    .boxZoom{
      width: 500px;
    }
  </style>
  <div class="boxZoom">


    <!-- Dialog overlay -->
    <div class="dialog-overlay" id="dialog-contentz">
      <!-- Dialog content -->
      <div style="width: 100%;text-align: end;">
        <button class="close-button" onclick="closeDialog()"> X </button>
      </div>
      <div class="dialog-content" id="dialog-content"
        style="transform: scale(0.9); display: flex; justify-content: center; align-items: center; width: 100%;">
        <!-- Content inside the dialog goes here -->

        <img class="dialog-image" id="dialog-image" src="" alt="Zoomed Image" style="height: 100%;">
        <!-- Close button -->

      </div>
      <div class="percen" id="zoom-show">
        <span id="zoom-sizeimage">100%</span>
      </div>
      <div class="sizeimage">
        <span id="sizeimage"></span>
      </div>

    </div>
  </div>

  <script src=".\java.js"></script>
</body>

</html>
